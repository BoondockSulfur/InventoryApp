{% extends "base.html" %}

{% block title %}Druckerverwaltung - InventoryApp{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-print"></i> Druckerverwaltung</h2>
                <button class="btn btn-primary" onclick="refreshPrinters()">
                    <i class="fas fa-sync"></i> Drucker aktualisieren
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-list"></i> Verfügbare Drucker</h5>
                </div>
                <div class="card-body">
                    <div id="printersList">
                        <div class="text-center p-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Lädt...</span>
                            </div>
                            <p class="mt-2">Drucker werden geladen...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentDefault = null;

async function refreshPrinters() {
    document.getElementById('printersList').innerHTML = `
        <div class="text-center p-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Lädt...</span>
            </div>
            <p class="mt-2">Drucker werden geladen...</p>
        </div>
    `;

    try {
        const response = await fetch('/printers/api/list');
        const data = await response.json();

        if (data.success) {
            currentDefault = data.default;
            displayPrinters(data.printers);
        } else {
            document.getElementById('printersList').innerHTML = `
                <div class="alert alert-danger">
                    Fehler beim Laden der Drucker
                </div>
            `;
        }
    } catch (error) {
        document.getElementById('printersList').innerHTML = `
            <div class="alert alert-danger">
                Fehler: ${error.message}
            </div>
        `;
    }
}

function displayPrinters(printers) {
    if (printers.length === 0) {
        document.getElementById('printersList').innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> Keine Drucker gefunden
            </div>
        `;
        return;
    }

    let html = '<div class="table-responsive"><table class="table table-hover">';
    html += `
        <thead>
            <tr>
                <th>Name</th>
                <th>Typ</th>
                <th>Anschluss</th>
                <th>Status</th>
                <th>Treiber</th>
                <th>Standard</th>
                <th>Aktionen</th>
            </tr>
        </thead>
        <tbody>
    `;

    printers.forEach(printer => {
        const isDefault = printer.name === currentDefault;
        const typeIcon = printer.type === 'usb' ? 'fa-usb' :
                        printer.type === 'network' ? 'fa-network-wired' : 'fa-plug';
        const typeClass = printer.type === 'usb' ? 'primary' :
                         printer.type === 'network' ? 'success' : 'secondary';
        const statusClass = printer.status === 'Ready' ? 'success' : 'warning';

        html += `
            <tr>
                <td>
                    <strong>${escapeHtml(printer.name)}</strong>
                    ${isDefault ? '<span class="badge bg-success ms-2">Standard</span>' : ''}
                </td>
                <td>
                    <span class="badge bg-${typeClass}">
                        <i class="fas ${typeIcon}"></i> ${printer.type.toUpperCase()}
                    </span>
                </td>
                <td><small class="text-muted">${escapeHtml(printer.port)}</small></td>
                <td><span class="badge bg-${statusClass}">${printer.status}</span></td>
                <td><small>${escapeHtml(printer.driver || '-')}</small></td>
                <td>
                    ${!isDefault ? `
                        <button class="btn btn-sm btn-outline-primary" onclick="setDefault('${escapeHtml(printer.name)}')">
                            <i class="fas fa-star"></i> Als Standard
                        </button>
                    ` : '<i class="fas fa-check text-success"></i>'}
                </td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="testPrint('${escapeHtml(printer.name)}')">
                        <i class="fas fa-print"></i> Testdruck
                    </button>
                </td>
            </tr>
        `;
    });

    html += '</tbody></table></div>';

    // Statistik hinzufügen
    const usbCount = printers.filter(p => p.type === 'usb').length;
    const networkCount = printers.filter(p => p.type === 'network').length;

    html += `
        <div class="mt-3 p-3 bg-light rounded">
            <strong>Statistik:</strong>
            <span class="badge bg-primary ms-2"><i class="fas fa-usb"></i> ${usbCount} USB</span>
            <span class="badge bg-success ms-2"><i class="fas fa-network-wired"></i> ${networkCount} Netzwerk</span>
            <span class="badge bg-secondary ms-2">Gesamt: ${printers.length}</span>
        </div>
    `;

    document.getElementById('printersList').innerHTML = html;
}

async function setDefault(printerName) {
    if (!confirm(`"${printerName}" als Standard-Drucker setzen?`)) {
        return;
    }

    try {
        const response = await fetch('/printers/api/set-default', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ printer_name: printerName })
        });

        const data = await response.json();

        if (data.success) {
            alert('Standard-Drucker erfolgreich geändert!');
            refreshPrinters();
        } else {
            alert('Fehler beim Setzen des Standard-Druckers');
        }
    } catch (error) {
        alert('Fehler: ' + error.message);
    }
}

async function testPrint(printerName) {
    if (!confirm(`Testseite an "${printerName}" drucken?`)) {
        return;
    }

    try {
        const response = await fetch('/printers/api/test', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ printer_name: printerName })
        });

        const data = await response.json();

        if (data.success) {
            alert('Testseite wurde an den Drucker gesendet!');
        } else {
            alert('Fehler beim Drucken der Testseite');
        }
    } catch (error) {
        alert('Fehler: ' + error.message);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Drucker beim Laden der Seite abrufen
refreshPrinters();
</script>
{% endblock %}
