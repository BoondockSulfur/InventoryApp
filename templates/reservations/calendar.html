{% extends 'base.html' %}
{% block title %}Reservierungs-Kalender{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-calendar3"></i> Reservierungs-Kalender</h1>
        <a href="{{ url_for('reservation_list') }}" class="btn btn-outline-secondary">
            <i class="bi bi-list"></i> Listenansicht
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');

    // Events aus dem Template laden
    var events = {{ events | tojson | safe }};

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'de',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: events,
        eventClick: function(info) {
            alert('Reservierung #' + info.event.id + '\n' + info.event.title);
        }
    });
    calendar.render();
});
</script>
{% endblock %}
