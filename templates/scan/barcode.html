{% extends 'base.html' %}
{% block title %}Barcode Scanner{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1><i class="bi bi-upc-scan"></i> Barcode Scanner</h1>
    <div class="row mt-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Barcode scannen</h5>
                    <div id="barcode-reader" style="width:100%; height:400px; border: 2px solid #ddd;"></div>
                    <div id="barcode-result" class="mt-3 alert alert-info" style="display:none;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Manuelle Eingabe</h5>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Barcode</label>
                            <input type="text" name="barcode" class="form-control" autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary">Suchen</button>
                    </form>
                    <hr>
                    <h6>Unterstützte Formate:</h6>
                    <ul class="small">
                        <li>EAN-13</li>
                        <li>UPC-A</li>
                        <li>Code 128</li>
                        <li>Code 39</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
// Barcode Scanner würde hier implementiert
console.log('Barcode scanner initialized');
</script>
{% endblock %}
