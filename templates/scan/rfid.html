{% extends 'base.html' %}
{% block title %}RFID Scanner{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1><i class="bi bi-broadcast"></i> RFID Scanner</h1>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">RFID-Tag scannen</h5>
                    <div class="text-center p-5" style="border: 2px dashed #ddd; border-radius: 10px;">
                        <i class="bi bi-broadcast" style="font-size: 4rem; color: #0d6efd;"></i>
                        <p class="mt-3">Halten Sie den RFID-Tag an den Scanner</p>
                        <div id="rfid-status" class="badge bg-warning">Warte auf Scanner...</div>
                    </div>
                    <div id="rfid-result" class="mt-3 alert alert-success" style="display:none;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Manuelle RFID-Zuweisung</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">RFID-Tag ID</label>
                            <input type="text" name="rfid" class="form-control" placeholder="z.B. A1B2C3D4">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Item</label>
                            <select name="item_id" class="form-select">
                                <option value="">Item auswählen</option>
                                {% for item in items %}
                                <option value="{{ item.id }}">{{ item.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Zuweisen</button>
                    </form>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5>Zuletzt gescannte Tags</h5>
                </div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item">Noch keine Tags gescannt</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// RFID Scanner Simulation
setInterval(() => {
    document.getElementById('rfid-status').innerHTML = 'Bereit';
    document.getElementById('rfid-status').className = 'badge bg-success';
}, 2000);
</script>
{% endblock %}
