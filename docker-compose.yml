version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: inventoryapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventoryapp}
      POSTGRES_USER: ${POSTGRES_USER:-inventoryapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventoryapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Redis for sessions and caching
  redis:
    image: redis:7-alpine
    container_name: inventoryapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Elasticsearch for advanced search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: inventoryapp_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # SECURITY: Set to 'true' in production and configure ELASTIC_PASSWORD
      # Then update ELASTICSEARCH_URL to: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED:-false}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      # If xpack.security.enabled=true, set ELASTIC_PASSWORD
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_network

  # Flask Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: inventoryapp_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      # Flask Config
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventoryapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventoryapp}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_TYPE: redis

      # Security
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: Lax

      # Mail
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # Dell Integration (optional)
      DELL_CLIENT_ID: ${DELL_CLIENT_ID:-}
      DELL_CLIENT_SECRET: ${DELL_CLIENT_SECRET:-}

      # Printer (optional)
      PRINTER_IP: ${PRINTER_IP:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}

      # Elasticsearch
      # If ELASTICSEARCH_SECURITY_ENABLED=true, use: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    volumes:
      - uploads:/app/static/uploads
      - logs:/app/logs
      - backups:/app/backups
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: inventoryapp_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "5500:80"
      - "5443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
      - logs:/var/log/nginx
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backup Service (optional)
  backup:
    image: postgres:16-alpine
    container_name: inventoryapp_backup
    restart: "no"
    depends_on:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventoryapp}
      POSTGRES_USER: ${POSTGRES_USER:-inventoryapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: /bin/sh
    command: -c "while true; do sleep 86400; /backup.sh; done"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  backups:
    driver: local
